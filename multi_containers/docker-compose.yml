services:
  kernel-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KERNEL_BUILDER_IMAGE:-linux-kernel-builder:latest}
    init: true
    volumes:
      # 挂载内核源码目录（根据实际情况调整）
      - ${KERNEL_SOURCE:-../linux-source}:/kernel:rw
      # 挂载 output 目录用于输出编译产物
      - ./output:/output:rw
      # 挂载辅助脚本（只读）
      - ./build.sh:/scripts/build.sh:ro
      - ./configure_kernel.sh:/scripts/configure_kernel.sh:ro
      - ./minimal_debug.config:/scripts/minimal_debug.config:ro
      - ../kernel_common:/scripts/kernel:ro
      - kernel-cache:/cache
    environment:
      # 设置架构（可选：arm64, arm, x86_64）
      - ARCH=${ARCH:-arm64}
      # 交叉编译工具前缀（如果需要）
      # - CROSS_COMPILE=aarch64-linux-gnu-
      # 并行编译任务数
      - JOBS=${JOBS:-2}
      - CROSS_COMPILE=${CROSS_COMPILE:-}
      - KERNEL_BASE_CONFIG=${KERNEL_BASE_CONFIG:-defconfig}
      - KERNEL_SESSION_NAME=${KERNEL_SESSION_NAME:-kernel-debug-multi}
      - MEMORY=${MEMORY:-2G}
      - CPUS=${CPUS:-2}
      # 输出目录
      - OUTPUT_DIR=/output
      # Rootfs 目录
      - ROOTFS_DIR=/output/rootfs
      # 强制重新配置内核（yes=删除现有.config并重新应用minimal_debug.config）
      # - FORCE_RECONFIG=yes
    working_dir: /kernel
    # 保持容器运行，方便调试
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  initramfs-builder:
    build:
      context: .
      dockerfile: Dockerfile.initramfs
      args:
        - BASE_IMAGE=${BASE_IMAGE:-alpine:3.22}
    image: ${ROOTFS_BUILDER_IMAGE:-multi-containers-initramfs:latest}
    volumes:
      # 挂载 output 目录用于读写 rootfs 和输出 initramfs
      - ./output:/output:rw
      # 挂载构建脚本
      - ./build_initramfs.sh:/scripts/build_initramfs.sh:ro
      - ../kernel_common:/scripts/kernel:ro
      - ${ROOTFS_OVERLAY:-./rootfs-overlay}:/overlay:ro
      - rootfs-cache:/cache
    environment:
      - OUTPUT_DIR=/output
      - ROOTFS_DIR=/output/rootfs
      - INITRAMFS_FILE=initramfs.cpio.gz
    working_dir: /work
    stdin_open: true
    tty: true
    command: /bin/sh

volumes:
  kernel-cache:
  rootfs-cache:
